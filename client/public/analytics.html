<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Analytics</title>
  <link rel="stylesheet" href="/assets/nav.css">
  <link rel="stylesheet" href="/assets/ui-breadcrumbs.css">
  <link rel="stylesheet" href="/assets/ui-loader.css">
  <link rel="stylesheet" href="/assets/analytics.css">
</head>
<body data-page="Analytics">
<div id="app-nav"></div>
<div id="app-breadcrumbs"></div>
<div id="toasts" aria-live="polite"></div>
<main class="container">
  <form id="filtersForm" class="filters">
    <label>Symbol <input name="symbol" list="symbols" value="SOLUSDT"></label>
    <datalist id="symbols"><option value="SOLUSDT"></option></datalist>
    <label>Interval
      <select name="interval">
        <option value="1m" selected>1m</option>
        <option value="5m">5m</option>
        <option value="15m">15m</option>
        <option value="1h">1h</option>
        <option value="4h">4h</option>
        <option value="1d">1d</option>
      </select>
    </label>
    <label>From <input name="from" placeholder="ms or ISO"></label>
    <label>To <input name="to" placeholder="ms or ISO"></label>
    <label>Downsampling
      <select name="ds">
        <option value="none">none</option>
        <option value="lttb" selected>lttb</option>
      </select>
    </label>
    <label>N <input name="n" type="number" value="1000"></label>
    <button type="button" data-apply>Apply</button>
    <button type="button" data-reset>Reset</button>
  </form>

  <section class="card" id="equityCard">
    <h2 tabindex="-1">Equity (Baseline + Overlays)</h2>
    <canvas id="equityChart" data-equity></canvas>
  </section>

  <section class="card" id="overlaysCard">
    <h2>Overlays</h2>
    <div id="overlaysList" class="overlays-list" data-overlays-list></div>
    <a id="csvExport" class="is-disabled" data-export-csv href="#">Export Overlays CSV</a>
  </section>

  <section class="card" id="jobsCard">
    <h2>Jobs</h2>
    <button type="button" data-jobs-refresh>Refresh</button>
    <label><input type="checkbox" data-jobs-auto> Auto refresh</label>
    <button type="button" data-backtest-quick>Backtest (quick)</button>
    <table id="jobsTable" data-jobs-table>
      <thead><tr><th>id</th><th>type</th><th>symbol</th><th>strategy</th><th>status</th><th>created</th><th>artifacts</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="card" id="portfolioCard">
    <h2>Portfolio</h2>
    <div data-portfolio></div>
  </section>
</main>
<div id="app-footer"></div>
<script type="module" src="/assets/nav.js"></script>
<script type="module" src="/assets/ui-breadcrumbs.js"></script>
<script type="module" src="/assets/ui-toast.js"></script>
<script src="/assets/vendor/chart.umd.js"></script>
<script type="module" src="/assets/analytics.js"></script>
</body>
</html>
