name: agent-take

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  take:
    if: ${{ github.event.issue.pull_request == null && contains(github.event.comment.body, '/agent take') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # (nebūtina) leisti tik pasirinktą vartotoją
      - name: Guard allowed actor
        run: |
          ALLOWED="${{ vars.AGENT_ALLOWED || github.repository_owner }}"
          if [[ "${{ github.actor }}" != "$ALLOWED" ]]; then
            echo "Not allowed: ${{ github.actor }}"; exit 1; fi

      - name: Compute vars
        id: vars
        run: |
          echo "NUM=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          echo "BRANCH=agent/issue-${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

      - name: Prepare git
        run: |
          git config user.name "agent-bot"
          git config user.email "agent-bot@users.noreply.github.com"
          git checkout -b "${{ steps.vars.outputs.BRANCH }}"

      - name: Generate plan with OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cat > prompt.json <<'EOF'
          {
            "model": "gpt-4o-mini",
            "temperature": 0.2,
            "messages": [
              {"role":"system","content":"You are a senior engineer. Produce a concrete, minimal plan to implement the issue, listing files to touch and acceptance criteria."},
              {"role":"user","content":"Title:\n${ISSUE_TITLE}\n\nBody:\n${ISSUE_BODY}\n\nConstraints: small, iterative steps; open a draft PR; include TODO checklist."}
            ]
          }
          EOF
          curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @prompt.json | jq -r '.choices[0].message.content' > AGENT_PLAN.md
          printf "\n---\nIssue: #%s\n" "${{ steps.vars.outputs.NUM }}" >> AGENT_PLAN.md

      - name: Commit plan
        run: |
          git add AGENT_PLAN.md
          git commit -m "agent: plan for #${{ steps.vars.outputs.NUM }}"
          git push origin "${{ steps.vars.outputs.BRANCH }}"

      - name: Create draft PR linked to issue
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          title: "agent: work on #${{ steps.vars.outputs.NUM }}"
          body: "Auto-generated plan.\n\nCloses #${{ steps.vars.outputs.NUM }}"
          branch: "${{ steps.vars.outputs.BRANCH }}"
          draft: true

      - name: Assign and comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit ${{ steps.vars.outputs.NUM }} -R ${{ github.repository }} --add-assignee "${{ github.actor }}"
          gh issue comment ${{ steps.vars.outputs.NUM }} -R ${{ github.repository }} --body "🤖 Agent started: ${{ steps.cpr.outputs.pull-request-url }}"

      # (neprivaloma) Nustatyti Project Status = In Progress jei turi Projects v2 numerį
      - name: Set Project status to In Progress
        if: ${{ vars.PROJECT_NUMBER != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          ISSUE_NUM: ${{ steps.vars.outputs.NUM }}
        run: |
          Q='query($owner:String!,$number:Int!){
            user(login:$owner){ projectV2(number:$number){
              id
              fields(first:50){ nodes{ __typename ... on ProjectV2SingleSelectField { id name options { id name } } } }
              items(first:100){ nodes{ id content{ __typename ... on Issue { number } } } }
            }}
          }'
          DATA=$(gh api graphql -f owner="$OWNER" -F number="$PROJECT_NUMBER" -f query="$Q")
          PROJ=$(jq -r '.data.user.projectV2.id' <<<"$DATA")
          FIELD=$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name=="Status") | .id' <<<"$DATA")
          OPT=$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name=="Status") | .options[] | select(.name=="In Progress" or .name=="Doing" or .name=="WIP") | .id' <<<"$DATA" | head -n1)
          ITEM=$(jq -r ".data.user.projectV2.items.nodes[] | select(.content.__typename==\"Issue\" and .content.number==$ISSUE_NUM) | .id" <<<"$DATA")
          if [[ -n "$FIELD" && -n "$OPT" && -n "$ITEM" ]]; then
            gh api graphql -F projectId="$PROJ" -F itemId="$ITEM" -F fieldId="$FIELD" -F optionId="$OPT" -f 'mutation($projectId:ID!,$itemId:ID!,$fieldId:ID!,$optionId:String!){updateProjectV2ItemFieldValue(input:{projectId:$projectId,itemId:$itemId,fieldId:$fieldId,value:{singleSelectOptionId:$optionId}}){projectV2Item{id}}}'
          fi
